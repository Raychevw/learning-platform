name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests, build & architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build services
        run: npm run build:services

      - name: Build SPA
        run: npm run build

      - name: Architecture verification
        run: npm run verify:lab3

      - name: Upload OpenAPI contracts
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: contracts/*.json
          if-no-files-found: error
