version: '3.8'

services:
  # Central PostgreSQL Database for University LMS Modular Monolith
  postgres:
    image: postgres:15-alpine
    container_name: lms_postgres
    environment:
      POSTGRES_USER: lms_admin
      POSTGRES_PASSWORD: lms_secure_password
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_admin -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Caching Course Pages, Chat Buffering & BullMQ Job Queues
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    ports:
      - "6379:6379"
    volumes:
      - lms_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible Object Storage (MinIO) for PDF lectures, materials and lab submissions
  minio:
    image: minio/minio:latest
    container_name: lms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_key
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web Console
    volumes:
      - lms_minio_data:/data
    restart: unless-stopped

  # Helper service to ensure S3 bucket 'lms-files' exists
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio_admin minio_secret_key;
      /usr/bin/mc mb --ignore-existing myminio/lms-files;
      /usr/bin/mc anonymous set download myminio/lms-files;
      exit 0;
      "

  # NestJS Modular Monolith Backend (Port 3000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: lms_admin
      DB_PASSWORD: lms_secure_password
      DB_NAME: lms_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio_admin
      S3_SECRET_KEY: minio_secret_key
      S3_BUCKET: lms-files
      JWT_SECRET: super_secure_university_jwt_secret_key_2026
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  lms_postgres_data:
  lms_redis_data:
  lms_minio_data:
