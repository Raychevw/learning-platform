# ============================================================================
# Studevo LMS — полный стек одной командой:
#   docker compose up --build
#
# Сервисы:
#   frontend          http://localhost:8080   (React build + nginx, /api -> gateway)
#   api-gateway       http://localhost:3000   (единая точка входа, JWT-проверка)
#   auth-service      http://localhost:3003   (SSO/логин, выпуск JWT)
#   course-service    http://localhost:3001   (каталог, модули, уроки, вебинары)
#   assignment-servicehttp://localhost:3002   (задания, сдачи, оценки, группы)
#
# Инфраструктура: PostgreSQL (3 изолированные БД), Redis (события), MinIO (S3).
# Секреты берутся из .env; значения по умолчанию — только для локальной разработки.
# ============================================================================

name: studevo

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - studevo

x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:-change_me_super_long_random_secret_at_least_32_chars}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}

services:
  # ---------------------------------------------------------------- databases
  course-db:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: studevo_course_db
    environment:
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      POSTGRES_DB: ${COURSE_DB_NAME:-course_db}
    ports:
      - "${COURSE_DB_PORT:-5433}:5432"
    volumes:
      - course_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms} -d ${COURSE_DB_NAME:-course_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  assignment-db:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: studevo_assignment_db
    environment:
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      POSTGRES_DB: ${ASSIGNMENT_DB_NAME:-assignment_db}
    ports:
      - "${ASSIGNMENT_DB_PORT:-5434}:5432"
    volumes:
      - assignment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms} -d ${ASSIGNMENT_DB_NAME:-assignment_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-db:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: studevo_auth_db
    environment:
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - "${AUTH_DB_PORT:-5435}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-db:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: studevo_audit_db
    environment:
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      POSTGRES_DB: ${AUDIT_DB_NAME:-audit_db}
    ports:
      - "${AUDIT_DB_PORT:-5436}:5432"
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms} -d ${AUDIT_DB_NAME:-audit_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  communication-db:
    <<: *service-defaults
    image: postgres:16-alpine
    container_name: studevo_communication_db
    environment:
      POSTGRES_USER: ${DB_USER:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      POSTGRES_DB: ${COMMUNICATION_DB_NAME:-communication_db}
    ports:
      - "${COMMUNICATION_DB_PORT:-5437}:5432"
    volumes:
      - communication_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms} -d ${COMMUNICATION_DB_NAME:-communication_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  coturn:
    image: coturn/coturn:latest
    container_name: studevo_coturn
    restart: unless-stopped
    command:
      - "-n"
      - "--log-file=stdout"
      - "--lt-cred-mech"
      - "--fingerprint"
      - "--realm=studevo.local"
      - "--user=${TURN_USERNAME:-lms}:${TURN_CREDENTIAL:-turn_password}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-cli"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    networks:
      - studevo

  # ---------------------------------------------------------------- infra
  redis_broker:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: studevo_redis_broker
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    <<: *service-defaults
    image: minio/minio:latest
    container_name: studevo_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secret_key}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: studevo_minio_init
    depends_on:
      minio:
        condition: service_started
    networks:
      - studevo
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minio_admin} ${S3_SECRET_KEY:-minio_secret_key}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-lms-files};
      mc anonymous set download local/${S3_BUCKET:-lms-files};
      exit 0;
      "
    restart: "no"

  # ---------------------------------------------------------------- microservices
  auth-service:
    <<: [*service-defaults]
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: studevo_auth_service
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 3003
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lms}
      DB_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      DB_NAME: ${AUTH_DB_NAME:-auth_db}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-123456}
    ports:
      - "${AUTH_SERVICE_PORT:-3003}:3003"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  course-service:
    <<: [*service-defaults]
    build:
      context: ./services/course-service
      dockerfile: Dockerfile
    container_name: studevo_course_service
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 3001
      DB_HOST: course-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lms}
      DB_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      DB_NAME: ${COURSE_DB_NAME:-course_db}
      USE_POSTGRES: "true"
      REDIS_HOST: redis_broker
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secret_key}
      S3_BUCKET: ${S3_BUCKET:-lms-files}
      S3_FORCE_PATH_STYLE: "true"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-turn:localhost:3478}
      TURN_USERNAME: ${TURN_USERNAME:-lms}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-turn_password}
    ports:
      - "${COURSE_SERVICE_PORT:-3001}:3001"
    depends_on:
      course-db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  assignment-service:
    <<: [*service-defaults]
    build:
      context: ./services/assignment-service
      dockerfile: Dockerfile
    container_name: studevo_assignment_service
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 3002
      DB_HOST: assignment-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lms}
      DB_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      DB_NAME: ${ASSIGNMENT_DB_NAME:-assignment_db}
      USE_POSTGRES: "true"
      REDIS_HOST: redis_broker
      REDIS_PORT: 6379
      COURSE_SERVICE_URL: http://course-service:3001
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ALLOW_LATE_SUBMISSION: ${ALLOW_LATE_SUBMISSION:-true}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio_secret_key}
      S3_BUCKET: ${S3_BUCKET:-lms-files}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${ASSIGNMENT_SERVICE_PORT:-3002}:3002"
    depends_on:
      assignment-db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  audit-service:
    <<: [*service-defaults]
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: studevo_audit_service
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 3004
      DB_HOST: audit-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lms}
      DB_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      DB_NAME: ${AUDIT_DB_NAME:-audit_db}
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-change_me_super_long_random_secret_at_least_32_chars}
    ports:
      - "${AUDIT_SERVICE_PORT:-3004}:3004"
    depends_on:
      audit-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  communication-service:
    <<: [*service-defaults]
    build:
      context: ./services/communication-service
      dockerfile: Dockerfile
    container_name: studevo_communication_service
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 3005
      DB_HOST: communication-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lms}
      DB_PASSWORD: ${DB_PASSWORD:-lms_secure_password}
      DB_NAME: ${COMMUNICATION_DB_NAME:-communication_db}
    ports:
      - "${COMMUNICATION_SERVICE_PORT:-3005}:3005"
    depends_on:
      communication-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------- edge
  api-gateway:
    <<: [*service-defaults]
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: studevo_api_gateway
    environment:
      <<: *jwt-env
      NODE_ENV: production
      PORT: 3000
      COURSE_SERVICE_URL: http://course-service:3001
      ASSIGNMENT_SERVICE_URL: http://assignment-service:3002
      AUTH_SERVICE_URL: http://auth-service:3003
      AUDIT_SERVICE_URL: http://audit-service:3004
      AUDIT_INGEST_TOKEN: ${AUDIT_INGEST_TOKEN:-change_me_super_long_random_secret_at_least_32_chars}
      COMMUNICATION_SERVICE_URL: http://communication-service:3005
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      course-service:
        condition: service_healthy
      assignment-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: infra/frontend/Dockerfile
    container_name: studevo_frontend
    ports:
      - "8080:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - studevo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  course_db_data:
  assignment_db_data:
  auth_db_data:
  audit_db_data:
  communication_db_data:
  redis_data:
  minio_data:

networks:
  studevo:
    driver: bridge
